<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title description">
<title id="title">tool-intake: check tools before adding them to your AI stack</title>
<desc id="description">A candidate tool is compared with existing skills and checked for maintenance, overlap and requirements. Three possible recommendations are Global, Project and Skip. Project is selected.</desc>
<!-- Editable vector artwork. All text remains text. Named groups separate copy, candidate cards, comparison, station, routes and destinations. No embedded raster images or external assets. -->
<defs>
 <linearGradient id="background" x2="1" y2="1"><stop stop-color="#111923"/><stop offset="1" stop-color="#1b2835"/></linearGradient>
 <linearGradient id="ceramic" x2="0.3" y2="1"><stop stop-color="#526170"/><stop offset="1" stop-color="#344351"/></linearGradient>
 <linearGradient id="card" x2="0.2" y2="1"><stop stop-color="#465665"/><stop offset="1" stop-color="#293744"/></linearGradient>
 <linearGradient id="blue" x2="0.4" y2="1"><stop stop-color="#649eff"/><stop offset="1" stop-color="#3068c6"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity=".3"/></filter>
 <filter id="small-shadow" x="-30%" y="-25%" width="170%" height="175%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity=".2"/></filter>
 <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M3 2 L8 6 L3 10" fill="none" stroke="#71818e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="blue-arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M3 2 L8 6 L3 10" fill="none" stroke="#649eff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <g id="wrench" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"><path d="M35 5 A13 13 0 0 0 18 22 L3 37 A5 5 0 0 0 10 44 L26 28 A13 13 0 0 0 43 11 L34 20 L25 12 Z"/></g>
 <g id="layers" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13 L22 2 L42 13 L22 24 Z M2 23 L22 34 L42 23 M2 33 L22 44 L42 33"/></g>
</defs>
<rect width="1800" height="600" fill="url(#background)"/>
<g id="copy" fill="#eef2f6">
 <text x="70" y="235" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="76" font-weight="700" letter-spacing="-4">tool-intake</text>
 <text x="74" y="292" font-family="'DejaVu Sans',Arial,sans-serif" font-size="27" letter-spacing="-.6"><tspan x="74">Check tools before adding them</tspan><tspan x="74" dy="40">to your AI stack.</tspan></text>
 <path d="M76 386 H117" stroke="#649eff" stroke-width="3" stroke-linecap="round"/>
 <text x="132" y="392" fill="#aab8c6" font-family="'DejaVu Sans',Arial,sans-serif" font-size="18">Evidence first. Then decide.</text>
</g>
<g id="candidate-cards" filter="url(#small-shadow)">
