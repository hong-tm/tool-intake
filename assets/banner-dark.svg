</g>
<g id="destinations" font-family="'DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="500" text-anchor="middle" fill="#eef2f6">
 <g id="global" transform="translate(1530 74)" filter="url(#small-shadow)"><rect x="18" y="9" width="181" height="90" rx="15" fill="#26323f"/><rect x="30" y="-10" width="121" height="76" rx="9" fill="#26323f" stroke="#526170"/><rect x="39" y="0" width="121" height="76" rx="9" fill="url(#card)" stroke="#526170"/><rect x="48" y="10" width="121" height="76" rx="9" fill="url(#card)" stroke="#526170"/><use xlink:href="#layers" transform="translate(88 24) scale(.7)" color="#aab8c6"/><path d="M8 61 Q8 52 19 52 H187 Q198 52 198 63 V103 Q198 114 186 114 H21 Q8 114 8 102 Z" fill="url(#ceramic)" stroke="#526170"/><text x="104" y="91">Global</text></g>
 <g id="project" transform="translate(1530 241)" filter="url(#small-shadow)"><rect x="18" y="9" width="181" height="90" rx="15" fill="#26323f"/><path d="M40 58 V6 Q40 -4 50 -4 H89 L103 9 H159 Q169 9 169 20 V63 Z" fill="#234d92" stroke="#649eff"/><path d="M30 66 V19 Q30 9 40 9 H81 L96 22 H160 Q170 22 170 33 V74 Z" fill="url(#blue)" stroke="#649eff"/><path d="M8 61 Q8 52 19 52 H187 Q198 52 198 63 V103 Q198 114 186 114 H21 Q8 114 8 102 Z" fill="url(#ceramic)" stroke="#526170"/><text x="104" y="91">Project</text></g>
