 <text x="1169" y="235">Maintenance</text><circle cx="1320" cy="229" r="5" fill="#a9c9ac"/>
 <rect x="1129" y="278" width="17" height="17" rx="4" fill="none" stroke="#aab8c6" stroke-width="2.2"/><rect x="1137" y="286" width="17" height="17" rx="4" fill="none" stroke="#aab8c6" stroke-width="2.2"/>
 <text x="1169" y="296">Overlap</text><circle cx="1320" cy="290" r="5" fill="#d9b67b"/>
 <path d="M1132 337 V346 Q1132 350 1137 350 H1147 V359 M1147 337 V343" fill="none" stroke="#aab8c6" stroke-width="2.2"/><circle cx="1132" cy="335" r="3" fill="#aab8c6"/><circle cx="1147" cy="335" r="3" fill="#aab8c6"/><circle cx="1147" cy="362" r="3" fill="#aab8c6"/>
