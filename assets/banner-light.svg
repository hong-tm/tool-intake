 <text x="74" y="285" font-family="Arial,Helvetica,'Noto Sans',sans-serif" font-size="24" letter-spacing="-.3"><tspan x="74">Check tools before</tspan><tspan x="74" dy="34">adding them to</tspan><tspan x="74" dy="34">your AI stack.</tspan></text>
</g>
