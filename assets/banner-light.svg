 <marker id="blue-arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M3 2 L8 6 L3 10" fill="none" stroke="#387ce8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <g id="wrench" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"><path d="M35 5 A13 13 0 0 0 18 22 L3 37 A5 5 0 0 0 10 44 L26 28 A13 13 0 0 0 43 11 L34 20 L25 12 Z"/></g>
 <g id="layers" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13 L22 2 L42 13 L22 24 Z M2 23 L22 34 L42 23 M2 33 L22 44 L42 33"/></g>
</defs>
<rect width="1800" height="600" fill="url(#background)"/>
