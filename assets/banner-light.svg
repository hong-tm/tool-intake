<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title description">
<title id="title">tool-intake: check tools before adding them to your AI stack</title>
<desc id="description">A candidate tool is compared with existing skills and checked for maintenance, overlap and requirements. Three possible recommendations are Global, Project and Skip. Project is selected.</desc>
<!-- Editable vector artwork. All text remains text. Named groups separate copy, candidate cards, comparison, station, routes and destinations. No embedded raster images or external assets. -->
<defs>
 <linearGradient id="background" x2="1" y2="1"><stop stop-color="#f8f5ee"/><stop offset="1" stop-color="#eeebe3"/></linearGradient>
 <linearGradient id="ceramic" x2="0.3" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eeeee8"/></linearGradient>
 <linearGradient id="card" x2="0.2" y2="1"><stop stop-color="#fcfcf8"/><stop offset="1" stop-color="#dce0dd"/></linearGradient>
 <linearGradient id="blue" x2="0.4" y2="1"><stop stop-color="#387ce8"/><stop offset="1" stop-color="#235cb7"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#53616b" flood-opacity=".15"/></filter>
 <filter id="small-shadow" x="-30%" y="-25%" width="170%" height="175%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#53616b" flood-opacity=".2"/></filter>
